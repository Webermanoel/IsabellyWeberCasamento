<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confirmação de Presença</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="girassol-container"></div>

    <main class="apresentacao">

        <h1 class="titulo_pricipal">
            Confirmação de Presença
        </h1>

        <p class="intro_ducao">
            Você está sendo convidado para o casamento de
            Isabelly e Weber!
        </p>

        <div class="campo-nome">
    <label for="nome">Confirme sua presença</label>

    <p>Digite seu nome e sobrenome abaixo</p>

    <input
        type="text"
        id="nome"
        name="nome"
        placeholder="Ex.: Maria Silva"
        autocomplete="name"
        maxlength="150"
        required
    >
    
    <p id="mensagem" role="status" aria-live="polite"></p>

            <button
            class="apresentacao__links__navegacao"
            type="button"
            id="confirmar">

            Confirmar presença ✅!

            <img
                class="apresentacao__links__imagem"
                src="images/alianças.jpg"
                alt="Alianças"
            >

        </button>

        <button
            class="apresentacao__links__navegacao"
            type="button"
            id="cancelar">

            Cancelar presença ❌!

            <img
                class="apresentacao__links__imagem"
                src="images/alianças.jpg"
                alt="Alianças"
            >

        </button>

        <a
            class="apresentacao__links__navegacao"
            href="presentes.html">

            <img
                class="apresentacao__links__imagem"
                src="images/presente.jpg"
                alt="Presente"
            >

            Lista de Presentes 🎁!

        </a>

</div>

    </main>

    <script src="confirmar.js" defer></script>
    <script src="index.js" defer></script>

</body>

</html>
