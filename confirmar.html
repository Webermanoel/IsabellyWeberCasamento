<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confirmação</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="girassol-container"></div>

    <main class="apresentacao">
         <h1 class="titulo_pricipal"><strong></strong> </h1>
            <p class="intro_ducao">Você esta sendo convidado para o casamento de
                Isabelly e Weber</p>

        <button
            class="apresentacao__links__navegacao"
            type="button"
            id="confirmar">

            Confirmar presença ✅!

            <img
                class="apresentacao__links__imagem"
                src="images/alianças.jpg"
                alt="icon alianca"
            >

        </button>


        <button
            class="apresentacao__links__navegacao"
            type="button"
            id="cancelar">

            Cancelar presença ❌!

            <img
                class="apresentacao__links__imagem"
                src="images/alianças.jpg"
                alt="icon alianca"
            >

        </button>
        
        <button
            class="apresentacao__links__navegacao"
            type="button"
            id="Presentes">
            
                    <a class="apresentacao__links__navegacao" href="presentes.html">
                        <img class="apresentacao__links__imagem" src="images/presente.jpg" alt="icon alianca">
                        Lista de Presentes 🎁!
                    </a>
                

        </button>

    </main>

    <script src="confirmar.js" defer></script>
    <script src="index.js" defer></script>

</body>

</html>
