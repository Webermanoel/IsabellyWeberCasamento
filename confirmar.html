<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="girassol-container"></div>
    <main class="apresentacao">
            <button class="apresentacao__links__navegacao" type="button" 
            id="confirmar">Confirmar presença ✅!
        <img class="apresentacao__links__imagem" src="images/alianças.jpg" alt="icon alianca">
    </button>
    
    <button class="apresentacao__links__navegacao" type="button"
            id="cancelar">Cancelar presença ❌!
        <img class="apresentacao__links__imagem" src="images/alianças.jpg" alt="icon alianca">
    </button>

    </main>
    
    <script src="confirmar.js" defer></script>
    <script src="index.js" defer></script>

</body>
</html>
